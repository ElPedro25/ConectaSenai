<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONECTA SENAI - Etapa 2 de 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>CONECTA SENAI</h2>
    <p class="step-indicator">Etapa 2 de 2</p>

    <form id="step2-form">
      <fieldset>
        <legend>Informações Complementares</legend>
        
        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
        </div>

        <div class="form-group">
          <label for="logradouro">Logradouro (Rua/Avenida)</label>
          <input type="text" id="logradouro" name="logradouro" placeholder="Ex: Rua das Flores" required>
        </div>

        <div class="form-row">
          <div class="form-group col-4">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" placeholder="123" required>
          </div>
          <div class="form-group col-8">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc.">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-5">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" placeholder="Bairro" required>
          </div>
          <div class="form-group col-5">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>
          </div>
          <div class="form-group col-2">
            <label for="uf">UF</label>
            <input type="text" id="uf" name="uf" placeholder="SP" maxlength="2" required>
          </div>
        </div>

        <div class="form-group">
          <label>Gênero</label>
          <div class="radio-group">
            <label><input type="radio" name="genero" value="feminino"> Feminino</label>
            <label><input type="radio" name="genero" value="masculino"> Masculino</label>
            <label><input type="radio" name="genero" value="outro"> Outro / Prefiro não informar</label>
          </div>
        </div>

      <fieldset>
        <legend>Configuração da Conta e Preferências</legend>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="notif-email" name="notifEmail" checked> 
            Desejo receber atualizações e novidades por e-mail.
          </label>
          <label>
            <input type="checkbox" id="notif-sms" name="notifSms"> 
            Desejo receber lembretes e alertas via SMS/WhatsApp.
          </label>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="termos" name="termos" required> 
            Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>. *
          </label>
        </div>
      </fieldset>

      <div class="button-group">
        <button type="button" id="btn-voltar" class="btn btn-secondary">Voltar para Etapa 1</button>
        <button type="submit" class="btn btn-primary"><a href="pagina3.html">Finalizar Cadastro</a></button></a>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
